# Project tracker — pings the team Telegram group on every push to main.
# This is meta/CI infrastructure and is not part of the Quorum product
# itself. The token can be the same one used for the Quorum bot.
#
# Setup (run once per repo):
#
#   1. Create a Telegram bot with @BotFather and copy the token.
#      (You can reuse the Quorum bot's token if it already exists.)
#
#   2. Add the bot to the team Telegram group as a member.
#      Then send any message in the group so getUpdates has data.
#
#   3. Find the group chat_id (it's a negative integer for groups):
#        curl -s "https://api.telegram.org/bot<TOKEN>/getUpdates" \
#          | jq '.result[].message.chat'
#
#   4. Configure GitHub from inside this repo (requires `gh auth login`):
#        gh secret set TELEGRAM_BOT_TOKEN --body "<token>"
#        gh variable set TELEGRAM_CHAT_ID --body "<chat_id>"
#
#   5. Push any commit. The bot posts within a few seconds.
#
# Per-commit opt-out: include [skip notify] anywhere in the commit message.

name: Notify Telegram on push

on:
  push:
    branches: [main]

jobs:
  notify:
    if: ${{ !contains(github.event.head_commit.message, '[skip notify]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SUBJECT: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN secret or TELEGRAM_CHAT_ID variable not set; skipping notification."
            exit 0
          fi

          SHA_SHORT="${SHA:0:7}"
          COMMIT_URL="${SERVER}/${REPO}/commit/${SHA}"
          SUBJ=$(printf '%s' "$SUBJECT" | head -n1)
          STAT=$(git diff --shortstat HEAD~1 HEAD 2>/dev/null | sed 's/^ *//' || echo "(no diff)")
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -5 || echo "")
          TOTAL=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          if [ "$TOTAL" -gt 5 ]; then
            FILES=$(printf '%s\n... and %d more' "$FILES" "$((TOTAL - 5))")
          fi

          TEXT=$(printf '[Quorum repo] %s pushed to main\n\n%s\n\n%s\n\n%s\n\n%s  %s' \
            "$AUTHOR" "$SUBJ" "$STAT" "$FILES" "$SHA_SHORT" "$COMMIT_URL")

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true"
